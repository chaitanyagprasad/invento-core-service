spring:
  application:
    name: invento-core-service
  grpc:
    server:
      port: 9090

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://host.docker.internal:4318/v1/metrics
        step: 10s

app:
  datasource:
    platform:
      url: jdbc:postgresql://host.docker.internal:5432/invento_platform
      username: postgres
      password: postgres
      hikari:
        pool-name: invento-platform-pool
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        keepalive-time: 60000

    provisioning:
      url: jdbc:postgresql://host.docker.internal:5432/postgres
      username: postgres
      password: postgres